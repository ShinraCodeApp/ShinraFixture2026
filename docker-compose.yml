version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shinra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shinra_db
      POSTGRES_USER: shinra
      POSTGRES_PASSWORD: shinra_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shinra -d shinra_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shinra_network

  # ── Redis Cache ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shinra_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shinra_network

  # ── Backend API ───────────────────────────────────────
  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
      target: production
    container_name: shinra_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://shinra:shinra_pass@postgres:5432/shinra_db
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/api/uploads:/app/uploads
    networks:
      - shinra_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js Web App ───────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shinra_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_WS_URL: ws://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api
    networks:
      - shinra_network

  # ── Admin Panel ───────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: shinra_admin
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://api:4000/api/v1
    ports:
      - '3001:80'
    depends_on:
      - api
    networks:
      - shinra_network

  # ── Nginx Reverse Proxy ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shinra_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
      - admin
    networks:
      - shinra_network

  # ── PgAdmin (Dev only) ────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shinra_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shinrafixture.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres
    profiles:
      - dev
    networks:
      - shinra_network

  # ── Redis Commander (Dev only) ────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: shinra_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    profiles:
      - dev
    networks:
      - shinra_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  shinra_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
