name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Build message'
        required: false
        default: 'Manual build'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/mobile/android/app/shinra-release.keystore

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://shinraapi-production.up.railway.app/api/v1
          EXPO_PUBLIC_WS_URL: https://shinraapi-production.up.railway.app
        run: npx expo prebuild --platform android --clean

      - name: Restore keystore after prebuild
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/mobile/android/app/shinra-release.keystore

      - name: Update signing config
        working-directory: apps/mobile/android
        run: |
          sed -i 's|storeFile file.*|storeFile file("shinra-release.keystore")|g' app/build.gradle || true

      - name: Build Release APK
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=shinra-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinraFixture2026-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Get APK info
        run: |
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "APK generado: $APK_SIZE"
          echo "Artifact disponible en la pestaña Actions de GitHub"
