name: Build Android AAB (Play Store)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project (expo prebuild)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://shinraapi-production.up.railway.app/api/v1
          EXPO_PUBLIC_WS_URL: https://shinraapi-production.up.railway.app
          EXPO_PUBLIC_PROJECT_ID: ca54987c-9913-406b-b6ca-6903fb0f507e
        run: npx expo prebuild --platform android --clean --no-install

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST="apps/mobile/android/app/src/main/AndroidManifest.xml"
          APP_ID="${{ secrets.ADMOB_APP_ID }}"
          if [ -z "$APP_ID" ]; then
            APP_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          sed -i "s|</application>|        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${APP_ID}\"/>\n        </application>|" "$MANIFEST"

      - name: Disable ProGuard/R8 minification (crash diagnosis)
        run: |
          GRADLE="apps/mobile/android/app/build.gradle.kts"
          if [ -f "$GRADLE" ]; then
            sed -i 's/minifyEnabled = true/minifyEnabled = false/g' "$GRADLE"
          fi
          GRADLE2="apps/mobile/android/app/build.gradle"
          if [ -f "$GRADLE2" ]; then
            sed -i 's/minifyEnabled true/minifyEnabled false/g' "$GRADLE2"
          fi

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > apps/mobile/android/app/shinra-release.keystore

      - name: Build Release AAB + APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://shinraapi-production.up.railway.app/api/v1
          EXPO_PUBLIC_WS_URL: https://shinraapi-production.up.railway.app
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.targetSdkVersion=35 \
            -Pandroid.injected.signing.store.file=$(pwd)/app/shinra-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ShinraFixture2026-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Rename APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk apps/mobile/android/app/build/outputs/apk/release/ShinraFixture2026.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShinraFixture2026-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/ShinraFixture2026.apk
          retention-days: 30
