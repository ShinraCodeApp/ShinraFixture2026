name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Generate Android project (expo prebuild)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://shinraapi-production.up.railway.app/api/v1
          EXPO_PUBLIC_WS_URL: https://shinraapi-production.up.railway.app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > apps/mobile/android/app/shinra-release.keystore

      - name: Build Release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://shinraapi-production.up.railway.app/api/v1
          EXPO_PUBLIC_WS_URL: https://shinraapi-production.up.railway.app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/shinra-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShinraFixture2026-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
